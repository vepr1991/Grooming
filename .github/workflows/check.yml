name: CRM checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grooming_crm_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: pip install -r backend/requirements.lock.txt
      - run: pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grooming_crm_test
      - run: npm ci && npm run build && npm run lint
        working-directory: client

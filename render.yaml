envVarGroups:
  - name: grooming-pilot
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: OPERATOR_IDS
        sync: false
      - key: APP_URL
        sync: false
      - key: SUBSCRIPTION_PRICE_MINOR
        sync: false
      - key: SUBSCRIPTION_CURRENCY
        value: KZT
      - key: PAYMENT_INSTRUCTIONS
        sync: false
services:
  - type: web
    name: grooming-backend
    branch: refactor
    runtime: docker
    rootDir: backend
    plan: starter
    preDeployCommand: python migrate.py
    healthCheckPath: /health
    envVars:
      - fromGroup: grooming-pilot
  - type: worker
    name: grooming-crm-worker
    branch: refactor
    runtime: docker
    rootDir: backend
    plan: starter
    dockerCommand: python worker.py
    envVars:
      - fromGroup: grooming-pilot
  - type: web
    name: Grooming_react_front
    branch: refactor
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
